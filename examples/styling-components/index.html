<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>Nodeflow</title>
    <link rel="stylesheet" href="./index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>Nodeflow demo</h1>
    <div class="controls">
      <button id="clear-button">Clear editor</button>
      <button id="add-input-node-button">Add input node</button>
      <button id="add-output-node-button">Add output node</button>
      <button id="add-input-output-node-button">Add input/output node</button>
      <button id="add-ten-input-node-button">Add ten input nodes</button>
      <button id="add-ten-output-node-button">Add ten output nodes</button>
      <button id="add-ten-input-output-node-button">Add ten connected nodes</button>
    </div>
    <div class="controls">
      <button id="save-button">Save graph</button>
      <button id="load-button">Load graph</button>
      <button id="recreate-button">Recreate editor</button>
      <output id="graph-summary" aria-live="polite"></output>
    </div>
    <p class="hint">
      Drag nodes or the background. Scroll to zoom. Click two compatible ports to connect.
      Right-click for actions; Escape cancels.
    </p>
    <p id="status" role="status"></p>
    <div id="canvas-container"></div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
